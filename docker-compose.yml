services:

  # ── Node.js Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xenon_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Use the local MongoDB container inside Docker
      - DATABASE=mongodb://mongo:27017/Xenon
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_COOKIE_EXPIRES_IN=${JWT_COOKIE_EXPIRES_IN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - xenon_network

  # ── React Frontend (served via Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xenon_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - xenon_network

  # ── Redis Cache (OTP Keys) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: xenon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xenon_network

  # ── MongoDB Database ─────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: xenon_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=Xenon
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xenon_network

  # ── RedisInsight (Redis GUI) ─────────────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: xenon_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - xenon_network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  redisinsight_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  xenon_network:
    driver: bridge
